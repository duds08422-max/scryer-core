name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: scryer-core-x86_64-linux.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: scryer-core-x86_64-macos.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: scryer-core-aarch64-macos.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Gate (same as CI)
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --verbose

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME}"
          DIR="scryer-core-${VER}-${{ matrix.target }}"
          mkdir -p "${DIR}"
          cp "target/${{ matrix.target }}/release/scryer" "${DIR}/" 2>/dev/null || \
            cp "target/${{ matrix.target }}/release/scryer-core" "${DIR}/"
          cp README.md LICENSE "${DIR}/" 2>/dev/null || cp README.md "${DIR}/"
          tar czf "${{ matrix.archive }}" "${DIR}"
          sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
