<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCRYER — ontologia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23060a12'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%2335e0a1' stroke-width='1.5' opacity='.9'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%2335e0a1'/%3E%3Cpath d='M16 4v5M16 23v5M4 16h5M23 16h5' stroke='%2335e0a1' stroke-width='1.5'/%3E%3C/svg%3E">
<style>
  :root {
    --bg0: #05070c; --bg1: #080d16; --bg2: #0c1320; --bg3: #111a2c; --bg4: #16223a;
    --line: rgba(140,170,230,.07); --line2: rgba(140,170,230,.14); --line3: rgba(140,170,230,.24);
    --tx0: #e9eff9; --tx1: #a8b6cf; --tx2: #66789a; --tx3: #3d4d6b;
    --acc: #35e0a1; --acc2: rgba(53,224,161,.12);
    --cy: #55c8ff; --cy2: rgba(85,200,255,.1);
    --warn: #f0b64e; --warn2: rgba(240,182,78,.1);
    --hot: #ff7d5c; --hot2: rgba(255,125,92,.12);
    --bad: #ff5470; --bad2: rgba(255,84,112,.1);
    --mono: "JetBrains Mono", "Cascadia Code", "SF Mono", "Fira Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg0); color: var(--tx0);
    font: 12.5px/1.5 var(--mono);
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(53,224,161,.25); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #1c2a44; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #2a3d61; }
  ::-webkit-scrollbar-corner { background: transparent; }
  a { color: var(--cy); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  button { font: inherit; cursor: pointer; background: none; border: none; color: inherit; }
  kbd {
    background: var(--bg3); border: 1px solid var(--line3); border-bottom-width: 2px;
    border-radius: 3px; padding: 0 4px; font-size: 10px; color: var(--tx1);
  }
  code { color: var(--cy); font-size: 11px; }

  /* ciemny tooltip vis-network (domyślny jest biały — brzydki) */
  div.vis-tooltip {
    background: rgba(8,13,22,.96) !important;
    border: 1px solid var(--line3) !important;
    border-radius: 4px !important;
    color: var(--tx0) !important;
    font: 11px/1.5 var(--mono) !important;
    padding: 6px 10px !important;
    box-shadow: 0 8px 24px rgba(0,0,0,.6) !important;
    white-space: pre-line !important;
    backdrop-filter: blur(6px);
  }

  /* ═══════════════ TOPBAR ═══════════════ */
  header {
    display: flex; align-items: stretch; height: 46px; flex-shrink: 0;
    background: linear-gradient(180deg, #0d1524, #080d16);
    border-bottom: 1px solid var(--line3);
  }
  .brand {
    display: flex; align-items: center; gap: 10px; padding: 0 16px;
    border-right: 1px solid var(--line); background: rgba(53,224,161,.03);
  }
  .brand svg { display: block; }
  .brand .word { font-weight: 700; font-size: 14px; letter-spacing: 5px; color: var(--tx0); }
  .brand .word em { color: var(--acc); font-style: normal; }
  .brand .ver { font-size: 9px; color: var(--tx3); letter-spacing: 1px; align-self: flex-start; margin-top: 9px; }

  #stats { display: flex; align-items: stretch; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  #stats::-webkit-scrollbar { display: none; }
  .stat {
    display: flex; flex-direction: column; justify-content: center; gap: 1px;
    padding: 0 14px; border-right: 1px solid var(--line); min-width: 74px; position: relative;
  }
  .stat .v { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
  .stat .k { font-size: 8.5px; text-transform: uppercase; letter-spacing: 1.6px; color: var(--tx2); }
  .stat .v { color: var(--tx0); }
  .stat.acc .v { color: var(--acc); } .stat.acc .k { color: rgba(53,224,161,.55); }
  .stat.hot .v { color: var(--hot); } .stat.hot .k { color: rgba(255,125,92,.55); }
  .stat.bad .v { color: var(--bad); } .stat.bad .k { color: rgba(255,84,112,.55); }
  .stat.warn .v { color: var(--warn); }

  .topright { display: flex; align-items: center; gap: 0; border-left: 1px solid var(--line); }
  .clock {
    padding: 0 14px; font-size: 11px; color: var(--tx2); letter-spacing: 1px;
    font-variant-numeric: tabular-nums; border-right: 1px solid var(--line); display: flex; align-items: center; gap: 7px;
  }
  .clock b { color: var(--tx1); font-weight: 500; }
  .live { display: flex; align-items: center; gap: 6px; padding: 0 12px; font-size: 9px; letter-spacing: 1.6px; color: var(--tx2); text-transform: uppercase; }
  #dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); position: relative; }
  #dot.ok { background: var(--acc); }
  #dot.ok::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 1px solid var(--acc); opacity: .5; animation: ping 2s ease-out infinite; }
  @keyframes ping { 0% { transform: scale(.6); opacity: .7; } 100% { transform: scale(1.6); opacity: 0; } }
  #refresh { padding: 0 16px; color: var(--tx2); border-left: 1px solid var(--line); transition: all .15s; font-size: 11px; letter-spacing: 1px; }
  #refresh:hover { color: var(--acc); background: var(--acc2); }

  /* ═══════════════ TABS ═══════════════ */
  nav { display: flex; align-items: stretch; height: 34px; padding: 0 8px; background: var(--bg1); border-bottom: 1px solid var(--line); flex-shrink: 0; }
  nav button {
    position: relative; padding: 0 18px; color: var(--tx2); font-size: 11px;
    letter-spacing: 1.2px; text-transform: uppercase; transition: color .15s;
    display: flex; align-items: center; gap: 7px;
  }
  nav button:hover { color: var(--tx0); }
  nav button.on { color: var(--acc); }
  nav button.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: var(--acc); box-shadow: 0 0 8px var(--acc); }
  nav .badge {
    font-size: 9px; padding: 1px 5px; border-radius: 3px; min-width: 16px; text-align: center;
    background: var(--bg3); color: var(--tx2); border: 1px solid var(--line2); font-variant-numeric: tabular-nums;
  }
  nav button.on .badge { color: var(--acc); border-color: rgba(53,224,161,.3); background: var(--acc2); }

  main { flex: 1; display: flex; min-height: 0; }

  /* ═══════════════ LEFT LIST ═══════════════ */
  #list-pane { width: 470px; min-width: 340px; display: flex; flex-direction: column; border-right: 1px solid var(--line3); flex-shrink: 0; background: var(--bg1); }
  .pane-label {
    display: flex; align-items: center; gap: 8px; padding: 8px 14px;
    font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--tx2);
    border-bottom: 1px solid var(--line); background: var(--bg2);
  }
  .pane-label::before { content: ""; width: 6px; height: 6px; background: var(--acc); clip-path: polygon(0 0, 100% 50%, 0 100%); }
  .pane-label .right { margin-left: auto; letter-spacing: .5px; color: var(--tx3); }

  #filters { display: flex; gap: 6px; padding: 9px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; background: var(--bg1); }
  .inp {
    background: var(--bg0); border: 1px solid var(--line2); color: var(--tx0);
    font: 12px var(--mono); padding: 6px 9px; border-radius: 4px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .inp::placeholder { color: var(--tx3); }
  .inp:focus { border-color: var(--acc); box-shadow: 0 0 0 1px rgba(53,224,161,.25); }
  select.inp { padding: 6px 4px; cursor: pointer; }
  select.inp option { background: var(--bg2); }
  #q { flex: 1; min-width: 150px; }

  #list-meta { padding: 5px 14px; color: var(--tx2); font-size: 10px; letter-spacing: .8px; text-transform: uppercase; border-bottom: 1px solid var(--line); background: var(--bg1); }
  #list-meta b { color: var(--acc); font-weight: 600; }

  #rows { overflow-y: auto; flex: 1; }
  #rows table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th {
    position: sticky; top: 0; z-index: 2; background: var(--bg2); color: var(--tx2);
    font-size: 9px; text-transform: uppercase; letter-spacing: 1.4px; font-weight: 500;
    text-align: left; padding: 6px 8px; user-select: none; border-bottom: 1px solid var(--line3);
  }
  th[data-sort]:hover { color: var(--cy); cursor: pointer; }
  th.c-sc, th.c-pop, th.c-mail { width: 50px; }
  th.c-sektor { width: 92px; }
  th.c-miasto { width: 104px; }
  td { padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--tx1); }
  tr.row { cursor: pointer; transition: background .1s; box-shadow: inset 2px 0 0 transparent; }
  tr.row:hover { background: var(--bg3); box-shadow: inset 2px 0 0 var(--cy); }
  tr.row.open { background: var(--bg4); box-shadow: inset 2px 0 0 var(--acc); }
  tr.row.open td { color: var(--tx0); }
  td.c-name { color: var(--tx0); }

  .score {
    display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 18px;
    border-radius: 3px; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums;
    border: 1px solid transparent;
  }
  .s-hot  { background: var(--hot2); color: var(--hot); border-color: rgba(255,125,92,.35); }
  .s-warm { background: var(--warn2); color: var(--warn); border-color: rgba(240,182,78,.3); }
  .s-cold { background: var(--cy2); color: var(--cy); border-color: rgba(85,200,255,.25); }
  .s-zero { background: var(--bg3); color: var(--tx2); border-color: var(--line2); }

  .sektor-dot { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 6px; }
  .mailed { color: var(--acc); font-size: 11px; }
  .nomail { color: var(--tx3); }

  /* ═══════════════ CENTER ═══════════════ */
  #center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .view { flex: 1; display: none; min-height: 0; }
  .view.on { display: flex; flex-direction: column; }

  #graph {
    flex: 1; position: relative; min-width: 0; min-height: 0;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(21,33,56,.55), transparent 70%),
      radial-gradient(rgba(90,120,180,.13) 1px, transparent 1px);
    background-size: auto, 22px 22px;
  }
  #g-diag {
    position: absolute; top: 12px; right: 14px; z-index: 6; pointer-events: none;
    font-size: 10px; line-height: 1.7; text-align: right; max-width: 360px;
    color: var(--tx2); text-shadow: 0 1px 2px #000;
  }
  .gbtn {
    background: var(--bg3); border: 1px solid var(--line2); color: var(--tx1);
    padding: 3px 10px; border-radius: 4px; font-size: 10px; letter-spacing: .5px;
  }
  .gbtn:hover { color: var(--acc); border-color: rgba(53,224,161,.4); }
  #graph-msg {
    position: absolute; top: 14px; left: 16px; z-index: 5; color: var(--acc);
    background: rgba(8,13,22,.9); border: 1px solid rgba(53,224,161,.3);
    padding: 5px 12px; border-radius: 4px; font-size: 11px; letter-spacing: .5px;
    backdrop-filter: blur(6px);
  }
  #graph-msg::before { content: "▍"; animation: blink 1s steps(1) infinite; margin-right: 6px; }
  @keyframes blink { 50% { opacity: 0; } }
  .scanline {
    position: absolute; left: 0; right: 0; height: 2px; z-index: 4; pointer-events: none;
    background: linear-gradient(90deg, transparent, rgba(53,224,161,.5), transparent);
    animation: scan 2.2s linear infinite;
  }
  @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

  .g-ctl {
    display: flex; gap: 16px; align-items: center; padding: 0 16px; height: 38px;
    background: var(--bg1); border-top: 1px solid var(--line3); flex-wrap: wrap;
  }
  .tgl { display: flex; gap: 14px; }
  .switch { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; color: var(--tx2); font-size: 11px; letter-spacing: .5px; transition: color .15s; }
  .switch:hover { color: var(--tx0); }
  .switch input { display: none; }
  .switch .track {
    width: 26px; height: 14px; border-radius: 7px; background: var(--bg3);
    border: 1px solid var(--line3); position: relative; transition: all .18s;
  }
  .switch .track::after {
    content: ""; position: absolute; top: 1px; left: 1px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--tx2); transition: all .18s;
  }
  .switch input:checked + .track { background: var(--acc2); border-color: rgba(53,224,161,.5); }
  .switch input:checked + .track::after { left: 13px; background: var(--acc); box-shadow: 0 0 6px rgba(53,224,161,.6); }

  #legend { display: flex; gap: 11px; align-items: center; padding-left: 14px; border-left: 1px solid var(--line2); }
  #legend .lg { display: flex; gap: 5px; align-items: center; color: var(--tx2); font-size: 10px; letter-spacing: .5px; }
  #legend .lg i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }
  #g-count { margin-left: auto; color: var(--tx3); font-size: 10px; letter-spacing: 1px; font-variant-numeric: tabular-nums; }

  /* przetargi / surface */
  #view-tenders, #view-surface { overflow: auto; background: var(--bg1); }
  .ttable { width: 100%; border-collapse: collapse; }
  .ttable th { position: sticky; top: 0; background: var(--bg2); color: var(--tx2); font-size: 9px; text-transform: uppercase; letter-spacing: 1.4px; text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--line3); }
  .ttable td { padding: 7px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--tx1); }
  .ttable td a { color: var(--tx0); }
  .ttable td a:hover { color: var(--cy); }
  #surface-out { padding: 16px; }
  .surface-row {
    padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 14px;
    align-items: baseline; transition: background .1s;
  }
  .surface-row:hover { background: var(--bg2); }
  .surface-row b { color: var(--tx0); font-weight: 500; }
  .surface-row .dom { font-size: 11.5px; color: var(--bad); }
  .surface-row .dom::before { content: "◉ "; font-size: 8px; }
  .callout {
    display: flex; gap: 10px; color: var(--tx1); background: var(--bg2);
    border: 1px solid var(--line2); border-left: 2px solid var(--acc);
    border-radius: 4px; padding: 10px 14px; margin-bottom: 14px; font-size: 11.5px; line-height: 1.6;
  }
  .callout.dim { border-left-color: var(--tx3); color: var(--tx2); }

  /* ═══════════════ DRAWER ═══════════════ */
  #drawer {
    width: 420px; background: rgba(12,19,32,.97); border-left: 1px solid var(--line3);
    display: none; flex-direction: column; overflow-y: auto; flex-shrink: 0;
    backdrop-filter: blur(10px); box-shadow: -20px 0 40px rgba(0,0,0,.5);
  }
  #drawer.on { display: flex; }
  #drawer .head { padding: 14px 16px; border-bottom: 1px solid var(--line3); position: sticky; top: 0; background: rgba(12,19,32,.98); z-index: 3; }
  #drawer .head h2 { font-size: 13px; line-height: 1.45; margin-bottom: 8px; padding-right: 30px; color: var(--tx0); font-weight: 600; }
  #drawer .head .sub { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #drawer-close {
    position: absolute; right: 10px; top: 10px; background: var(--bg3); border: 1px solid var(--line2);
    color: var(--tx2); width: 24px; height: 24px; border-radius: 4px; font-size: 11px; transition: all .12s;
  }
  #drawer-close:hover { color: var(--bad); border-color: var(--bad); background: var(--bad2); }
  #drawer section { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  #drawer h3 {
    font-size: 8.5px; text-transform: uppercase; letter-spacing: 2px;
    color: var(--tx2); margin-bottom: 8px; font-weight: 600; display: flex; align-items: center; gap: 8px;
  }
  #drawer h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .kv { display: grid; grid-template-columns: 95px 1fr; gap: 2px 10px; font-size: 11.5px; }
  .kv .k { color: var(--tx2); text-transform: uppercase; font-size: 9.5px; letter-spacing: 1px; padding-top: 2px; }
  .kv .v2 { color: var(--tx1); }
  .pill {
    display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 3px;
    font-size: 9.5px; letter-spacing: .8px; text-transform: uppercase; border: 1px solid transparent;
  }
  .p-ok  { background: var(--acc2); color: var(--acc); border-color: rgba(53,224,161,.3); }
  .p-bad { background: var(--bad2); color: var(--bad); border-color: rgba(255,84,112,.3); }
  .p-dim { background: var(--bg3); color: var(--tx2); border-color: var(--line2); }
  .em { color: var(--cy); cursor: pointer; border-radius: 3px; padding: 0 2px; font-size: 11.5px; transition: all .1s; }
  .em:hover { background: var(--cy2); text-decoration: none; }
  .em::before { content: "› "; color: var(--tx3); }
  .tl { list-style: none; font-size: 11.5px; }
  .tl li { padding: 5px 0; border-bottom: 1px dashed rgba(140,170,230,.06); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .tl .t { color: var(--tx3); font-size: 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tl .mail { color: var(--tx2); font-size: 10.5px; }

  /* ═══════════════ CONSOLE ═══════════════ */
  #console-pane {
    height: 216px; display: flex; flex-direction: column;
    border-top: 1px solid var(--line3); background: #04060b; flex-shrink: 0;
  }
  #console-bar {
    display: flex; gap: 10px; padding: 8px 14px; align-items: center;
    border-bottom: 1px solid var(--line); background: var(--bg1);
  }
  .prompt-tag {
    color: var(--acc); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
    display: flex; align-items: center; gap: 6px;
  }
  .prompt-tag::before { content: "❯"; font-size: 12px; }
  #dq-in {
    flex: 1; background: transparent; border: none; border-bottom: 1px solid var(--line2);
    color: var(--cy); font: 12.5px var(--mono); padding: 6px 2px; outline: none; transition: border-color .15s;
  }
  #dq-in:focus { border-bottom-color: var(--acc); }
  #dq-in::placeholder { color: var(--tx3); }
  .btn {
    background: var(--bg3); border: 1px solid var(--line2); color: var(--tx1);
    padding: 5px 14px; border-radius: 4px; font-size: 11px; letter-spacing: .5px; transition: all .13s;
  }
  .btn:hover { border-color: var(--line3); color: var(--tx0); background: var(--bg4); }
  #dq-run { color: var(--acc); border-color: rgba(53,224,161,.35); background: var(--acc2); }
  #dq-run:hover { box-shadow: 0 0 10px rgba(53,224,161,.2); border-color: var(--acc); }
  #console-out { flex: 1; overflow: auto; padding: 8px 16px; font-size: 11.5px; line-height: 1.7; }
  #console-out .err { color: var(--bad); }
  #console-out .hint { color: var(--tx2); }
  #console-out .n { color: var(--acc); font-weight: 700; }
  #console-out .rrow { color: var(--tx1); }
  #console-out .rrow::before { content: "│ "; color: var(--tx3); }

  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--bg4); border: 1px solid var(--line3); color: var(--tx0);
    padding: 8px 16px; border-radius: 5px; display: none; z-index: 99; max-width: 80%;
    font-size: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.6); opacity: 0; transition: all .2s;
  }
  #toast.show { display: block; opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.err { border-color: rgba(255,84,112,.5); background: #1c0e16; }
  #toast.ok { border-color: rgba(53,224,161,.5); }

  .empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 40px 20px; color: var(--tx3); font-size: 11px; letter-spacing: 1px; text-align: center;
  }
  .empty::before { content: "◌"; font-size: 28px; opacity: .5; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 32 32" fill="none">
      <circle cx="16" cy="16" r="10" stroke="#35e0a1" stroke-width="1.2" opacity=".5"/>
      <circle cx="16" cy="16" r="6" stroke="#35e0a1" stroke-width="1.2" opacity=".8"/>
      <circle cx="16" cy="16" r="2" fill="#35e0a1"/>
      <path d="M16 2v6M16 24v6M2 16h6M24 16h6" stroke="#35e0a1" stroke-width="1.2" opacity=".5"/>
    </svg>
    <span class="word">SCR<em>Y</em>ER</span>
    <span class="ver">v0.7.1</span>
  </div>
  <div id="stats"></div>
  <div class="topright">
    <span class="clock"><span style="color:var(--tx3)">UTC</span> <b id="clock">--:--:--</b></span>
    <span class="live"><span id="dot"></span> <span id="live-label">offline</span></span>
    <button id="refresh">⟳ sync</button>
  </div>

</div>

<div id="toast"></div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const SECTOR_COLORS = {
  wodociagi: "#55c8ff", szpital: "#ff5470", "admin-publiczna": "#f0b64e",
  education: "#b18ce8", energy: "#ffa657", transport: "#39d2c0",
  gov: "#35e0a1", water: "#55c8ff", health: "#ff5470", admin: "#f0b64e",
  other: "#66789a",
};
const colorOf = (s) => SECTOR_COLORS[s] || SECTOR_COLORS.other;

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    let msg = r.status;
    try { msg = (await r.json()).error || msg; } catch {}
    throw new Error(msg);
  }
  return r.json();
}
function toast(msg, kind) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "show " + (kind || "");
  clearTimeout(t._h); t._h = setTimeout(() => t.className = "", 3200);
}
const fmtN = (n) => n >= 1e6 ? (n/1e6).toFixed(1).replace(".0","") + "M" : n >= 1e3 ? Math.round(n/1e3) + "k" : String(n ?? 0);
const scoreCls = (v) => v >= 15 ? "s-hot" : v >= 8 ? "s-warm" : v > 0 ? "s-cold" : "s-zero";

/* zegar UTC */
setInterval(() => {
  const d = new Date();
  $("#clock").textContent = [d.getUTCHours(), d.getUTCMinutes(), d.getUTCSeconds()]
    .map(x => String(x).padStart(2, "0")).join(":");
}, 1000);

/* ---------------- stats ---------------- */
async function loadStats() {
  try {
    const s = await api("/api/stats");
    $("#dot").classList.add("ok");
    $("#live-label").textContent = "live";
    $("#stats").innerHTML = [
      ["podmioty", s.podmioty, ""], ["domeny", s.domeny, ""], ["osoby", s.osoby, ""],
      ["przetargi", s.przetargi, ""], ["interakcje", s.interakcje, ""],
      ["kontakt", s.skontaktowani, "acc"], ["hot", s.hot, s.hot ? "hot" : ""],
      ["bez dmarc", s.bez_dmarc, s.bez_dmarc ? "bad" : ""],
    ].map(([k, v, cls]) => `<div class="stat ${cls}"><div class="v">${v}</div><div class="k">${k}</div></div>`).join("");
    $("#b-graph").textContent = s.podmioty;
    $("#b-tenders").textContent = s.przetargi;
    const sel = $("#f-sektor");
    const cur = sel.value;
    sel.innerHTML = '<option value="">sektor: *</option>' +
      s.sektors.filter(x => x.sektor).map(x => `<option value="${esc(x.sektor)}">${esc(x.sektor)} ${x.n}</option>`).join("");
    sel.value = cur;
  } catch (e) { $("#dot").classList.remove("ok"); $("#live-label").textContent = "offline"; toast("API: " + e.message, "err"); }
}

/* ---------------- lista podmiotów ---------------- */
let sortKey = "score";
async function loadPodmioty() {
  const p = new URLSearchParams();
  if ($("#q").value.trim()) p.set("q", $("#q").value.trim());
  if ($("#f-sektor").value) p.set("sektor", $("#f-sektor").value);
  if ($("#f-kontakt").value) p.set("kontakt", $("#f-kontakt").value);
  p.set("sort", sortKey); p.set("limit", "500");
  $("#list-meta").textContent = "query…";
  try {
    const d = await api("/api/podmioty?" + p);
    $("#list-meta").innerHTML = `pokazano <b>${d.count}</b> / ${d.total}`;
    $("#pane-count").textContent = `${d.total} rekordów`;
    $("#tbody").innerHTML = d.items.map(it => `<tr class="row" data-id="${it.id}">
        <td><span class="score ${scoreCls(it.tier_score)}">${it.tier_score}</span></td>
        <td class="c-name" title="${esc(it.nazwa)}">${esc(it.nazwa)}</td>
        <td style="font-variant-numeric:tabular-nums;color:var(--tx2)">${it.pop ? fmtN(it.pop) : "—"}</td>
        <td><span class="sektor-dot" style="background:${colorOf(it.sektor)}"></span>${esc(it.sektor || "—")}</td>
        <td title="${esc(it.miasto)}">${esc(it.miasto || "—")}</td>
        <td>${it.maile ? `<span class="mailed">${it.maile}✉</span>` : '<span class="nomail">·</span>'}</td>
      </tr>`).join("");
  } catch (e) { $("#list-meta").textContent = "błąd: " + e.message; }
}

/* ---------------- drawer ---------------- */
async function showPodmiot(id) {
  try {
    $$("#tbody tr").forEach(tr => tr.classList.toggle("open", tr.dataset.id == id));
    const d = await api("/api/podmiot/" + id);
    const p = d.podmiot;
    $("#d-name").textContent = p.nazwa;
    $("#d-sub").innerHTML =
      `<span class="score ${scoreCls(p.tier_score)}">${p.tier_score}</span>` +
      `<span class="pill p-dim"><span class="sektor-dot" style="background:${colorOf(p.sektor)}"></span>${esc(p.sektor||"—")}</span>` +
      `<span class="pill p-dim">KSC ${esc(p.ksc_status)}</span>`;
    const ts = (u) => u ? new Date(u*1000).toLocaleString("pl-PL", {dateStyle:"short", timeStyle:"short"}) : "—";
    $("#d-body").innerHTML = `
      <section><h3>profil</h3><div class="kv">
        <span class="k">nip</span><span class="v2">${esc(p.nip)||"—"}</span>
        <span class="k">miasto</span><span class="v2">${esc(p.miasto)||"—"}</span>
        <span class="k">województwo</span><span class="v2">${esc(p.wojewodztwo)||"—"}</span>
        <span class="k">populacja</span><span class="v2">${p.pop?fmtN(p.pop):"—"}</span>
        <span class="k">źródła</span><span class="v2">${esc(p.zrodla)||"—"}</span>
      </div></section>
      <section><h3>domeny / poczta</h3>${
        d.domeny.length ? d.domeny.map(x => `<div style="margin-bottom:7px">
          <div style="color:var(--tx0);margin-bottom:2px">${esc(x.nazwa)}</div>
          ${x.mx?'<span class="pill p-ok">mx</span>':'<span class="pill p-dim">no-mx</span>'}
          ${x.dmarc?'<span class="pill p-ok">dmarc</span>':'<span class="pill p-bad">bez dmarc</span>'}
          ${x.spf?'':'<span class="pill p-bad">bez spf</span>'}
        </div>`).join("") : '<span class="hint">brak domen</span>'
      }</section>
      <section><h3>osoby · ${d.osoby.length}</h3>${
        d.osoby.map(o => `<div style="margin-bottom:3px"><span class="em" data-copy="${esc(o.email)}" title="klik = kopiuj">${esc(o.email)}</span>
          ${o.rola?`<span class="pill p-dim">${esc(o.rola)}</span>`:""}</div>`).join("") || "—"
      }</section>
      <section><h3>akcje</h3>
        <button class="btn" id="d-recon" style="width:100%" data-dom="${esc(d.domeny[0]?.nazwa || "")}">◉ recon (DNS + RDAP + crt.sh + WWW) → ontologia</button>
      </section>
      <section><h3>interakcje · ${d.interakcje.length}</h3><ul class="tl">${
        d.interakcje.map(i => `<li><span class="t">${ts(i.ts)}</span>
          <span class="pill ${i.typ==="email_sent"?"p-ok":"p-dim"}">${esc(i.typ)}</span>
          <span class="mail">${esc(i.email)}</span>
          <span style="color:var(--tx1)">${esc(i.temat)}</span></li>`).join("") || "<li>—</li>"
      }</ul></section>`;
    $("#drawer").classList.add("on");
    setTimeout(() => window.dispatchEvent(new Event("resize")), 100); // canvas grafu za drawerem
  } catch (e) { toast(e.message, "err"); }
}
$("#drawer-close").onclick = () => { $("#drawer").classList.remove("on"); $$("#tbody tr").forEach(tr => tr.classList.remove("open")); setTimeout(() => window.dispatchEvent(new Event("resize")), 100); };
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("#d-recon");
  if (b) {
    const dom = b.dataset.dom;
    if (!dom) return toast("podmiot nie ma domeny w grafie — użyj zakładki Discovery", "err");
    document.querySelector('nav button[data-tab="discover"]').click();
    $("#disc-in").value = dom;
    $("#disc-run").click();
  }
});
document.addEventListener("click", (ev) => {
  const em = ev.target.closest("[data-copy]");
  if (em) { navigator.clipboard?.writeText(em.dataset.copy); toast("skopiowano " + em.dataset.copy, "ok"); }
});

/* ---------------- graf ---------------- */
let graphBuilt = false, GRAPH = null, nodes, edges;
let visLoading = null;
function loadVis() {
  if (typeof vis !== "undefined") return Promise.resolve();
  if (visLoading) return visLoading;
  visLoading = new Promise((ok, bad) => {
    // lokalnie z binarki → fallback CDN → błąd z jasnym komunikatem
    const tryUrl = (url, fail) => {
      const s = document.createElement("script");
      s.src = url;
      s.onload = ok;
      s.onerror = fail;
      document.head.appendChild(s);
    };
    tryUrl("/assets/vis-network.min.js", () =>
      tryUrl("https://unpkg.com/vis-network/standalone/umd/vis-network.min.js", () =>
        bad(new Error("vis-network niedostępny (lokal i CDN)"))
      )
    );
  });
  return visLoading;
}

/* diagnostyka grafu — widać na ekranie KAŻDY krok startu */
function gdiag(msg, bad) {
  let d = document.getElementById("g-diag");
  if (!d) {
    $("#graph").insertAdjacentHTML("beforeend", '<div id="g-diag"></div>');
    d = document.getElementById("g-diag");
  }
  const t = new Date().toTimeString().slice(0, 8);
  d.insertAdjacentHTML("beforeend", `<div>· ${t} — ${esc(msg)}</div>`);
  d.style.color = bad ? "var(--bad)" : "var(--tx2)";
}

async function buildGraph() {
  gdiag("start");
  try {
    if (!GRAPH) {
      gdiag("fetch /api/graph");
      GRAPH = await api("/api/graph");
      gdiag(`dane OK: ${GRAPH.podmioty?.length ?? "?"} podmiotów`);
    }
    gdiag("ładowanie vis-network");
    await loadVis();
    gdiag("vis OK, render");
    graphBuilt = true;
    renderGraph();
  } catch (e) {
    gdiag("BŁĄD: " + e.message, true);
  }
}

function renderGraph() {
  const showD = $("#g-domeny").checked, showO = $("#g-osoby").checked, onlyHot = $("#g-only-hot").checked;
  const emailed = new Set(GRAPH.emailed || []);
  const n = [], e = [];
  if (!$("#legend").childElementCount) {
    $("#legend").innerHTML = Object.entries(SECTOR_COLORS)
      .filter(([k]) => !["other","water","health","admin"].includes(k))
      .map(([k, c]) => `<span class="lg"><i style="background:${c}"></i>${k}</span>`).join("");
  }
  for (const p of GRAPH.podmioty) {
    if (onlyHot && p.score < 15) continue;
    const hot = p.score >= 15;
    n.push({
      id: "p" + p.id,
      label: p.nazwa.length > 36 ? p.nazwa.slice(0, 35) + "…" : p.nazwa,
      title: `${p.nazwa}\nscore: ${p.score}\nmiasto: ${p.miasto || "—"}\n(klik = profil)`,
      shape: "box",
      shapeProperties: { borderRadius: 4 },
      margin: 7,
      borderWidth: hot ? 1.5 : 1,
      color: {
        background: hot ? "#241410" : "#0e1726",
        border: hot ? "#ff7d5c" : "#22334e",
        highlight: { background: "#15243c", border: colorOf(p.sektor) },
        hover: { background: "#15243c", border: colorOf(p.sektor) },
      },
      font: { face: "JetBrains Mono, monospace", size: 10.5, color: hot ? "#ffb8a3" : "#9fb0ca" },
    });
  }
  if (showD) for (const d of GRAPH.domeny) {
    n.push({
      id: "d" + d.id, label: d.nazwa, shape: "dot",
      size: 4.5, color: { background: d.mx ? "#55c8ff" : "#2c3c58", border: "transparent" },
      font: { size: 9, color: "#5d7089", face: "JetBrains Mono, monospace" },
      title: `${d.nazwa}\nMX: ${d.mx ? "tak" : "nie"}\nDMARC: ${d.dmarc || "BRAK"}`,
    });
    e.push({ from: "p" + d.podmiot_id, to: "d" + d.id, color: { color: "rgba(90,120,180,.14)" } });
  }
  if (showO) for (const o of GRAPH.osoby) {
    const got = emailed.has(o.email);
    n.push({
      id: "o" + o.id, label: got ? "✉ " + o.email : o.email, shape: "dot", size: 3.5,
      color: { background: got ? "#35e0a1" : "#28374f", border: "transparent" },
      font: { size: 9, color: got ? "#35e0a1" : "#42536d", face: "JetBrains Mono, monospace" }, title: o.email,
    });
    e.push({ from: "p" + o.podmiot_id, to: "o" + o.id, color: { color: "rgba(90,120,180,.1)" } });
  }
  nodes = new vis.DataSet(n); edges = new vis.DataSet(e);
  const container = $("#graph");
  const cw = container.clientWidth, ch = container.clientHeight;
  gdiag(`węzły: ${n.length}, kontener: ${cw}×${ch}px`);
  if (!n.length) {
    container.innerHTML = '<div class="empty" style="position:absolute;inset:0">brak węzłów — rozluźnij filtry</div>';
    $("#g-count").textContent = "0 węzłów";
    return;
  }
  // kontener o zerowym rozmiarze = vis narysuje 0×0 canvas („pusto”);
  // czekamy 200ms i próbujemy raz jeszcze zanim poddamy diagnostykę
  if (cw < 50 || ch < 50) {
    gdiag("kontener spłaszczony — retry za 200ms", true);
    setTimeout(() => renderGraph(), 200);
    return;
  }
  container.innerHTML = '<div id="graph-msg">stabilizacja</div><div class="scanline"></div>';
  let network;
  try {
    network = new vis.Network(container, { nodes, edges }, {
    autoResize: true,
    physics: {
      solver: "barnesHut",
      barnesHut: { gravitationalConstant: -3200, springConstant: 0.045, springLength: 110, damping: 0.45, avoidOverlap: 0.1 },
      stabilization: { enabled: true, iterations: 220, fit: true },
    },
    interaction: { hover: true, tooltipDelay: 140, hideEdgesOnDrag: true },
    nodes: { shape: "box", font: { face: "JetBrains Mono, monospace" } },
    edges: { color: { color: "#1c2a44" }, smooth: false, selectionWidth: 1.5 },
    });
  } catch (err) {
    gdiag("vis.Network throw: " + err.message, true);
    return;
  }
  gdiag("Network utworzony");
  network.on("stabilizationProgress", (p) => {
    $("#graph-msg").textContent = `stabilizacja ${Math.round((p.iterations / p.total) * 100)}%`;
  });
  network.on("stabilizationIterationsDone", () => {
    $("#graph-msg")?.remove();
    container.querySelector(".scanline")?.remove();
    network.fit();
  });
  network.on("click", (params) => {
    const id = params.nodes[0];
    if (id && String(id).startsWith("p")) showPodmiot(Number(String(id).slice(1)));
  });
  // vis słucha WYŁĄCZNIE na window.resize — zmiana kontenera (drawer!) jej nie
  // łapie; redraw() też nie skaluje canvasa. Jedyny skuteczny fix: wystrzelić
  // window.resize + fit, gdy rozmiar #graph się zmieni.
  if (window._graphRO) window._graphRO.disconnect();
  clearTimeout(window._grz);
  window._graphRO = new ResizeObserver(() => {
    clearTimeout(window._grz);
    window._grz = setTimeout(() => {
      window.dispatchEvent(new Event("resize"));
      network.fit();
    }, 90);
  });
  window._graphRO.observe(container);
  // po stabilizacji upewnij się, że canvas ma niezerowe wymiary
  network.once("stabilizationIterationsDone", () => {
    const cv = container.querySelector("canvas");
    gdiag(cv ? `canvas: ${cv.clientWidth}×${cv.clientHeight}px` : "BRAK canvas w DOM!", !cv || cv.clientWidth < 10);
  });
  $("#g-count").textContent = `${n.length} węzłów · ${e.length} krawędzi`;
}
$("#g-rerender").onclick = () => { GRAPH = null; buildGraph(); };

/* ---------------- discovery ---------------- */
async function runDiscover(q) {
  const out = $("#disc-out");
  out.innerHTML = '<span style="color:var(--tx2)">recon w toku — DNS → RDAP → crt.sh → WWW → search (może potrwać ~10-30s)…</span>';
  try {
    const d = await api("/api/discover", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ q }),
    });
    renderDiscovery(d);
    loadStats(); // dane mogły wejść do grafu
  } catch (e) {
    out.innerHTML = `<span style="color:var(--bad)">✗ ${esc(e.message)}</span>`;
  }
}
function renderDiscovery(d) {
  const out = $("#disc-out");
  const L = [];
  const sec = (t) => L.push(`<div style="margin:14px 0 6px;color:var(--acc);font-size:9.5px;letter-spacing:2px;text-transform:uppercase;display:flex;gap:8px;align-items:center">${t}<span style="flex:1;height:1px;background:var(--line)"></span></div>`);
  const kv = (k, v, cls) => v ? L.push(`<div><span style="color:var(--tx2);text-transform:uppercase;font-size:9.5px;letter-spacing:1px">${k}</span> <span class="${cls||""}" style="color:var(--tx0)">${v}</span></div>`) : null;
  const list = (arr, cls) => (arr || []).map(x => `<div style="color:${cls||"var(--tx1)"};padding-left:12px">· ${esc(String(x))}</div>`).join("");

  L.push(`<div style="color:var(--tx0);font-size:13px;margin-bottom:2px">${esc(d.query)}</div>`);
  kv("typ", d.kind);
  if (d.domain_guessed) kv("domena z search", d.domain_guessed, "");
  if (d.domain) kv("domena", d.domain);

  if (d.dns) {
    sec("dns");
    kv("A", (d.dns.a || []).join(", "));
    kv("AAAA", (d.dns.aaaa || []).join(", "));
    if (d.dns.mx?.length) { kv("MX", ""); L.push(list(d.dns.mx, "var(--cy)")); }
    if (d.dns.ns?.length) { kv("NS", ""); L.push(list(d.dns.ns)); }
    kv("SPF", (d.dns.spf || [])[0]);
    kv("DMARC", (d.dns.dmarc || [])[0], d.dns.dmarc?.length ? "" : "");
    if (!d.dns.has_mail) L.push('<div style="color:var(--warn)">⚠ brak MX — domena nie odbiera poczty</div>');
    if (!d.dns.dmarc?.length) L.push('<div style="color:var(--bad)">◉ brak DMARC — spoofing możliwy (amunicja)</div>');
  }
  if (d.rdap && d.rdap !== null) {
    sec("rdap / rejestracja");
    kv("registrar", esc(d.rdap.registrar || "—"));
    if (d.rdap.dates?.length) L.push(list(d.rdap.dates));
    if (d.rdap.status?.length) kv("status", esc(d.rdap.status.join(", ")));
  }
  if (d.subdomains?.length) {
    sec("subdomeny (crt.sh) · " + d.subdomains.length);
    L.push(list(d.subdomains.slice(0, 40), "var(--cy)"));
  }
  const w = d.www;
  if (w?.ok) {
    sec("www · " + (w.url || ""));
    kv("title", esc(w.title || "—"));
    kv("opis", esc(w.description || "—"));
    kv("cms/generator", esc(w.generator || "—"), w.generator ? "" : "");
    if (w.emails?.length) { kv("emaile", ""); L.push(list(w.emails, "var(--cy)")); }
    if (w.phones?.length) { kv("telefony", ""); L.push(list(w.phones)); }
    if (w.persons?.length) { kv("osoby (wzorzec imie.nazwisko)", ""); L.push(list(w.persons, "var(--acc)")); }
  } else if (w) {
    sec("www");
    L.push(`<div style="color:var(--tx2)">${esc(w.note || "brak odpowiedzi")}</div>`);
  }
  if (d.web_results?.results?.length) {
    sec(`web · ${d.web_results.engine} · ${d.web_results.results.length}`);
    for (const r of d.web_results.results.slice(0, 10)) {
      L.push(`<div style="padding:3px 0"><a href="${esc(r.url)}" target="_blank" rel="noopener" style="color:var(--tx0)">${esc(r.title || r.url)}</a><div style="color:var(--tx3);font-size:10px;padding-left:12px">${esc(r.url)}</div></div>`);
    }
  } else if (d.web_results?.error) {
    sec("web");
    L.push(`<div style="color:var(--tx2)">search niedostępny: ${esc(d.web_results.error)}</div>`);
  }
  out.innerHTML = L.join("");
}
$("#disc-run").onclick = () => { const q = $("#disc-in").value.trim(); if (q) runDiscover(q); };
$("#disc-in").addEventListener("keydown", (ev) => { if (ev.key === "Enter") $("#disc-run").click(); });
["#g-domeny", "#g-osoby", "#g-only-hot"].forEach(sel => $(sel).onchange = () => graphBuilt && renderGraph());

/* ---------------- przetargi / attack surface ---------------- */
async function loadTenders() {
  try {
    const d = await api("/api/tenders");
    $("#b-tenders").textContent = d.count;
    $("#tenders-tb").innerHTML = d.items.map(t => `<tr>
      <td><span class="score ${scoreCls(t.match_score)}">${t.match_score}</span></td>
      <td title="${esc(t.tytul)}"><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.tytul)}</a></td>
      <td>${esc(t.org)}</td><td style="font-variant-numeric:tabular-nums">${esc(t.deadline)}</td><td style="color:var(--tx2)">${esc(t.cpv)}</td></tr>`).join("")
      || '<tr><td colspan="5"><div class="empty">brak przetargów w grafie — import: scryer-core tenders &lt;bzp.json&gt;</div></td></tr>';
  } catch (e) { toast(e.message, "err"); }
}
async function loadSurface() {
  try {
    const d = await api("/api/attack-surface");
    $("#b-surface").textContent = d.count;
    $("#surface-out").innerHTML = d.items.length
      ? `<div class="callout">HOT-podmioty (score ≥ 15) z domeną bez DMARC — amunicja na pierwszy mail: <i>„pocztą państwa można podszywać się bez przeszkód”</i>. Klik w podmiot na liście otworzy pełny profil.</div>` +
        d.items.map(x => `<div class="surface-row"><b>${esc(x.nazwa)}</b><span class="dom">${esc(x.domena)}</span></div>`).join("")
      : '<div class="callout dim">brak sygnałów — HOT-y z dziurawym DMARC-em się skończyły. Uruchom scoring, żeby podbić tier_score bazy.</div>';
  } catch (e) { toast(e.message, "err"); }
}

/* ---------------- dQuery ---------------- */
async function runQuery(q) {
  const out = $("#console-out");
  out.innerHTML = `<span class="hint">query…</span>`;
  try {
    const d = await api("/api/query", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ q }),
    });
    out.innerHTML = `<div><span class="n">${d.count}</span> <span class="hint">wyników</span></div>` +
      d.rows.map(r => `<div class="rrow">${esc(r)}</div>`).join("");
  } catch (e) { out.innerHTML = `<div class="err">✗ ${esc(e.message)}</div>`; }
}

/* ---------------- events ---------------- */
$$("nav button").forEach(b => b.onclick = () => {
  $$("nav button").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  $$(".view").forEach(v => v.classList.remove("on"));
  $("#view-" + b.dataset.tab).classList.add("on");
  if (b.dataset.tab === "graph") buildGraph();
  if (b.dataset.tab === "tenders") loadTenders();
  if (b.dataset.tab === "surface") loadSurface();
  if (b.dataset.tab === "discover") $("#disc-in").focus();
});

let deb;
$("#q").addEventListener("input", () => { clearTimeout(deb); deb = setTimeout(loadPodmioty, 250); });
["#f-sektor", "#f-kontakt"].forEach(s => $(s).onchange = loadPodmioty);
$$("th[data-sort]").forEach(th => th.onclick = () => { if (th.dataset.sort) { sortKey = th.dataset.sort; loadPodmioty(); } });
$("#tbody").addEventListener("click", (ev) => {
  const tr = ev.target.closest("tr.row");
  if (tr) showPodmiot(Number(tr.dataset.id));
});
$("#dq-run").onclick = () => { const q = $("#dq-in").value.trim(); if (q) runQuery(q); };
$("#dq-in").addEventListener("keydown", (ev) => { if (ev.key === "Enter") $("#dq-run").click(); });
$("#dq-export").onclick = () => {
  const rows = [...$("#console-out").querySelectorAll(".rrow")].map(d => d.textContent);
  if (!rows.length) return toast("nic do eksportu — najpierw uruchom zapytanie", "err");
  const blob = new Blob([rows.join("\n")], { type: "application/jsonl" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "scryer-query.jsonl"; a.click();
  toast("eksport scryer-query.jsonl", "ok");
};
$("#refresh").onclick = () => { loadStats(); loadPodmioty(); if (graphBuilt) buildGraph(); };
document.addEventListener("keydown", (ev) => {
  const typing = ["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName);
  if (ev.key === "/" && !typing) { ev.preventDefault(); $("#q").focus(); }
  if (ev.key === "`" && !typing) { ev.preventDefault(); $("#dq-in").focus(); }
  if (ev.key.toLowerCase() === "d" && !typing) { ev.preventDefault(); document.querySelector('nav button[data-tab="discover"]').click(); }
  if (ev.key === "Escape") $("#drawer-close").click();
  if (ev.key.toLowerCase() === "r" && !typing) $("#refresh").click();
});

/* ---------------- boot ---------------- */
loadStats();
loadPodmioty();
buildGraph(); // GRAF = zakładka domyślna — startuj od razu
setInterval(loadStats, 30000);
</script>
</body>
