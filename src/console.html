<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCRYER — OSINT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23060a12'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%2335e0a1' stroke-width='1.5' opacity='.9'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%2335e0a1'/%3E%3Cpath d='M16 4v5M16 23v5M4 16h5M23 16h5' stroke='%2335e0a1' stroke-width='1.5'/%3E%3C/svg%3E">
<style>
  :root {
    --bg0: #05070c; --bg1: #080d16; --bg2: #0c1320; --bg3: #111a2c; --bg4: #16223a;
    --line: rgba(140,170,230,.07); --line2: rgba(140,170,230,.14); --line3: rgba(140,170,230,.24);
    --tx0: #e9eff9; --tx1: #a8b6cf; --tx2: #66789a; --tx3: #3d4d6b;
    --acc: #35e0a1; --acc2: rgba(53,224,161,.12);
    --cy: #55c8ff; --cy2: rgba(85,200,255,.1);
    --warn: #f0b64e; --warn2: rgba(240,182,78,.1);
    --hot: #ff7d5c; --hot2: rgba(255,125,92,.12);
    --bad: #ff5470; --bad2: rgba(255,84,112,.1);
    --mono: "JetBrains Mono", "Cascadia Code", "SF Mono", "Fira Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg0); color: var(--tx0);
    font: 12.5px/1.5 var(--mono);
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(53,224,161,.25); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #1c2a44; border-radius: 4px; }
  ::-webkit-scrollbar-corner { background: transparent; }
  a { color: var(--cy); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  button { font: inherit; cursor: pointer; background: none; border: none; color: inherit; }
  kbd { background: var(--bg3); border: 1px solid var(--line3); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; font-size: 10px; color: var(--tx1); }

  /* ══════════ TOPBAR ══════════ */
  header {
    display: flex; align-items: stretch; height: 46px; flex-shrink: 0;
    background: linear-gradient(180deg, #0d1524, #080d16);
    border-bottom: 1px solid var(--line3);
  }
  .brand {
    display: flex; align-items: center; gap: 10px; padding: 0 16px;
    border-right: 1px solid var(--line); background: rgba(53,224,161,.03);
  }
  .brand svg { display: block; }
  .brand .word { font-weight: 700; font-size: 14px; letter-spacing: 5px; color: var(--tx0); }
  .brand .word em { color: var(--acc); font-style: normal; }
  .brand .ver { font-size: 9px; color: var(--tx3); letter-spacing: 1px; align-self: flex-start; margin-top: 9px; }
  #db-count {
    display: flex; align-items: center; padding: 0 16px; font-size: 11px;
    color: var(--tx2); letter-spacing: .5px; border-right: 1px solid var(--line);
    font-variant-numeric: tabular-nums; flex: 1; min-width: 0; overflow: hidden; white-space: nowrap;
  }
  #db-count b { color: var(--tx1); font-weight: 500; }
  .topright { display: flex; align-items: stretch; }
  .clock {
    padding: 0 14px; font-size: 11px; color: var(--tx2); letter-spacing: 1px;
    font-variant-numeric: tabular-nums; border-right: 1px solid var(--line); display: flex; align-items: center; gap: 7px;
  }
  .clock b { color: var(--tx1); font-weight: 500; }
  .live { display: flex; align-items: center; gap: 6px; padding: 0 12px; font-size: 9px; letter-spacing: 1.6px; color: var(--tx2); text-transform: uppercase; }
  #dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); position: relative; }
  #dot.ok { background: var(--acc); }
  #dot.ok::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 1px solid var(--acc); opacity: .5; animation: ping 2s ease-out infinite; }
  @keyframes ping { 0% { transform: scale(.6); opacity: .7; } 100% { transform: scale(1.6); opacity: 0; } }
  #refresh { padding: 0 16px; color: var(--tx2); border-left: 1px solid var(--line); transition: all .15s; font-size: 11px; letter-spacing: 1px; }
  #refresh:hover { color: var(--acc); background: var(--acc2); }

  /* ══════════ TABS (tylko 2) ══════════ */
  nav { display: flex; align-items: stretch; height: 34px; padding: 0 8px; background: var(--bg1); border-bottom: 1px solid var(--line); flex-shrink: 0; }
  nav button {
    position: relative; padding: 0 22px; color: var(--tx2); font-size: 11px;
    letter-spacing: 1.2px; text-transform: uppercase; transition: color .15s;
    display: flex; align-items: center; gap: 7px;
  }
  nav button:hover { color: var(--tx0); }
  nav button.on { color: var(--acc); }
  nav button.on::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: -1px; height: 2px; background: var(--acc); box-shadow: 0 0 8px var(--acc); }
  nav .badge {
    font-size: 9px; padding: 1px 5px; border-radius: 3px; min-width: 16px; text-align: center;
    background: var(--bg3); color: var(--tx2); border: 1px solid var(--line2); font-variant-numeric: tabular-nums;
  }
  nav button.on .badge { color: var(--acc); border-color: rgba(53,224,161,.3); background: var(--acc2); }

  main { flex: 1; display: flex; min-height: 0; }
  .view { flex: 1; display: none; min-height: 0; }
  .view.on { display: flex; flex-direction: column; }

  /* ══════════ SZUKAJ ══════════ */
  #s-bar { display: flex; gap: 10px; padding: 26px 16px 12px; align-items: center; border-bottom: 1px solid var(--line); }
  #s-tag { color: var(--acc); font-size: 11px; letter-spacing: 2px; white-space: nowrap; }
  #s-in {
    flex: 1; background: var(--bg0); border: 1px solid var(--line2); color: var(--tx0);
    font: 13.5px var(--mono); padding: 10px 13px; border-radius: 4px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  #s-in::placeholder { color: var(--tx3); }
  #s-in:focus { border-color: var(--acc); box-shadow: 0 0 0 1px rgba(53,224,161,.25); }
  .gbtn {
    background: var(--bg3); border: 1px solid var(--line2); color: var(--tx1);
    padding: 6px 12px; border-radius: 4px; font-size: 10.5px; letter-spacing: .5px; white-space: nowrap;
  }
  .gbtn:hover { color: var(--acc); border-color: rgba(53,224,161,.4); }
  .btn {
    background: var(--bg3); border: 1px solid var(--line2); color: var(--tx1);
    padding: 8px 16px; border-radius: 4px; font-size: 11.5px; letter-spacing: .5px; transition: all .13s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--line3); color: var(--tx0); background: var(--bg4); }
  #s-run { color: var(--acc); border-color: rgba(53,224,161,.35); background: var(--acc2); }
  #s-run:hover { box-shadow: 0 0 10px rgba(53,224,161,.2); border-color: var(--acc); }
  #s-said {
    display: none; padding: 9px 16px; font-size: 11.5px; color: var(--tx1);
    border-bottom: 1px solid var(--line); background: var(--bg1);
  }
  #s-out { flex: 1; overflow: auto; padding: 6px 0 20px; }
  .sec-label {
    display: flex; gap: 8px; align-items: center; padding: 14px 16px 6px;
    font-size: 9.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--tx2);
  }
  .sec-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .hit {
    display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--line); transition: background .1s;
  }
  .hit:hover { background: var(--bg2); }
  .hit .t { color: var(--tx0); font-size: 13px; }
  .hit .d { color: var(--cy); font-size: 11.5px; }
  .hit .u { color: var(--tx3); font-size: 10px; width: 100%; padding-left: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hit .acts { margin-left: auto; display: flex; gap: 6px; }
  .pill {
    display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 3px;
    font-size: 9.5px; letter-spacing: .8px; text-transform: uppercase; border: 1px solid transparent;
  }
  .p-ok  { background: var(--acc2); color: var(--acc); border-color: rgba(53,224,161,.3); }
  .p-bad { background: var(--bad2); color: var(--bad); border-color: rgba(255,84,112,.3); }
  .p-dim { background: var(--bg3); color: var(--tx2); border-color: var(--line2); }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 2px 10px; font-size: 11.5px; }
  .kv .k { color: var(--tx2); text-transform: uppercase; font-size: 9.5px; letter-spacing: 1px; padding-top: 2px; }
  .kv .v2 { color: var(--tx1); overflow-wrap: anywhere; }
  .lrow { padding: 6px 16px; border-bottom: 1px solid var(--line); font-size: 12px; display: flex; gap: 10px; align-items: baseline; }
  .lrow:hover { background: var(--bg2); }
  .score {
    display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 18px;
    border-radius: 3px; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums;
    border: 1px solid transparent; flex-shrink: 0;
  }
  .s-hot  { background: var(--hot2); color: var(--hot); border-color: rgba(255,125,92,.35); }
  .s-warm { background: var(--warn2); color: var(--warn); border-color: rgba(240,182,78,.3); }
  .s-cold { background: var(--cy2); color: var(--cy); border-color: rgba(85,200,255,.25); }
  .s-zero { background: var(--bg3); color: var(--tx2); border-color: var(--line2); }
  .sektor-dot { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 6px; }

  /* ══════════ GRAF ══════════ */
  #graph {
    flex: 1; position: relative; min-width: 0; min-height: 0;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(21,33,56,.5), transparent 70%),
      radial-gradient(rgba(90,120,180,.10) 1px, transparent 1px);
    background-size: auto, 24px 24px;
  }
  #g-diag {
    position: absolute; top: 12px; right: 14px; z-index: 6; pointer-events: none;
    font-size: 10px; line-height: 1.7; text-align: right; max-width: 340px;
    color: var(--tx2); text-shadow: 0 1px 2px #000;
  }
  #g-empty {
    position: absolute; inset: 0; z-index: 3; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    color: var(--tx3); font-size: 11.5px; letter-spacing: 1px; text-align: center; padding: 0 40px;
  }
  #g-empty::before { content: "◌"; font-size: 30px; opacity: .5; }
  #g-empty b { color: var(--tx2); font-weight: 500; }
  .g-ctl {
    display: flex; gap: 16px; align-items: center; padding: 0 16px; height: 38px;
    background: var(--bg1); border-top: 1px solid var(--line3); flex-wrap: wrap;
  }
  #legend { display: flex; gap: 12px; align-items: center; }
  #legend .lg { display: flex; gap: 5px; align-items: center; color: var(--tx2); font-size: 10px; letter-spacing: .5px; }
  #legend .lg i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }
  #g-count { margin-left: auto; color: var(--tx3); font-size: 10px; letter-spacing: 1px; font-variant-numeric: tabular-nums; }

  /* ══════════ DRAWER ══════════ */
  #drawer {
    width: 420px; background: rgba(12,19,32,.97); border-left: 1px solid var(--line3);
    display: none; flex-direction: column; overflow-y: auto; flex-shrink: 0;
    backdrop-filter: blur(10px); box-shadow: -20px 0 40px rgba(0,0,0,.5);
  }
  #drawer.on { display: flex; }
  #drawer .head { padding: 14px 16px; border-bottom: 1px solid var(--line3); position: sticky; top: 0; background: rgba(12,19,32,.98); z-index: 3; }
  #drawer .head h2 { font-size: 13px; line-height: 1.45; margin-bottom: 8px; padding-right: 30px; color: var(--tx0); font-weight: 600; }
  #drawer .head .sub { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #drawer-close {
    position: absolute; right: 10px; top: 10px; background: var(--bg3); border: 1px solid var(--line2);
    color: var(--tx2); width: 24px; height: 24px; border-radius: 4px; font-size: 11px; transition: all .12s;
  }
  #drawer-close:hover { color: var(--bad); border-color: var(--bad); background: var(--bad2); }
  #drawer section { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  #drawer h3 {
    font-size: 8.5px; text-transform: uppercase; letter-spacing: 2px;
    color: var(--tx2); margin-bottom: 8px; font-weight: 600; display: flex; align-items: center; gap: 8px;
  }
  #drawer h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .em { color: var(--cy); cursor: pointer; border-radius: 3px; padding: 0 2px; font-size: 11.5px; }
  .em:hover { background: var(--cy2); }

  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--bg4); border: 1px solid var(--line3); color: var(--tx0);
    padding: 8px 16px; border-radius: 5px; display: none; z-index: 99; max-width: 80%;
    font-size: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.6); opacity: 0; transition: all .2s;
  }
  #toast.show { display: block; opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.err { border-color: rgba(255,84,112,.5); background: #1c0e16; }
  #toast.ok { border-color: rgba(53,224,161,.5); }

  .empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 40px 20px; color: var(--tx3); font-size: 11px; letter-spacing: 1px; text-align: center;
  }
  .empty::before { content: "◌"; font-size: 26px; opacity: .5; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 32 32" fill="none">
      <circle cx="16" cy="16" r="10" stroke="#35e0a1" stroke-width="1.2" opacity=".5"/>
      <circle cx="16" cy="16" r="6" stroke="#35e0a1" stroke-width="1.2" opacity=".8"/>
      <circle cx="16" cy="16" r="2" fill="#35e0a1"/>
      <path d="M16 2v6M16 24v6M2 16h6M24 16h6" stroke="#35e0a1" stroke-width="1.2" opacity=".5"/>
    </svg>
    <span class="word">SCR<em>Y</em>ER</span>
    <span class="ver">v0.11.0</span>
  </div>
  <div id="db-count">—</div>
  <div class="topright">
    <span class="clock"><span style="color:var(--tx3)">UTC</span> <b id="clock">--:--:--</b></span>
    <span class="live"><span id="dot"></span> <span id="live-label">offline</span></span>
    <button id="refresh" title="odśwież dane">⟳</button>
  </div>
</header>

<nav>
  <button data-tab="szukaj" class="on">Szukaj</button>
  <button data-tab="graph">Graf <span class="badge" id="b-graph">0</span></button>
</nav>

<main>
  <div class="view on" id="view-szukaj" style="flex-direction:column">
    <div id="s-bar">
      <span id="s-tag">SZUKAJ</span>
      <input id="s-in" placeholder="cokolwiek — firma, instytucja, domena, miasto… scryer pyta internet" autocomplete="off" spellcheck="false">
      <button id="s-net" class="gbtn" title="auto: lokal + internet · internet: tylko OSINT">◉ net: auto</button>
      <button id="s-run" class="btn">szukaj ⏎</button>
    </div>
    <div id="s-said"></div>
    <div id="s-out"></div>
  </div>

  <div class="view" id="view-graph">
    <div id="graph"></div>
    <div class="g-ctl">
      <span id="legend"></span>
      <button class="gbtn" id="g-fit" title="dopasuj widok">⤢ fit</button>
      <span id="g-count"></span>
    </div>
  </div>

  <div id="drawer">
    <div class="head">
      <button id="drawer-close">✕</button>
      <h2 id="d-name">—</h2>
      <div class="sub" id="d-sub"></div>
    </div>
    <div id="d-body"></div>
  </div>
</main>

<div id="toast"></div>

<script src="/assets/graph-engine.js"></script>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>\"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const SECTOR_COLORS = {
  websearch: "#39d2c0", wodociagi: "#55c8ff", szpital: "#ff5470", "admin-publiczna": "#f0b64e",
  education: "#b18ce8", energy: "#ffa657", transport: "#39d2c0", gov: "#35e0a1",
  discovery: "#66789a", other: "#66789a",
};
const colorOf = (s) => SECTOR_COLORS[s] || SECTOR_COLORS.other;

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    let msg = r.status;
    try { msg = (await r.json()).error || msg; } catch {}
    throw new Error(msg);
  }
  return r.json();
}
function toast(msg, kind) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "show " + (kind || "");
  clearTimeout(t._h); t._h = setTimeout(() => t.className = "", 3200);
}
const fmtN = (n) => n >= 1e6 ? (n/1e6).toFixed(1).replace(".0","") + "M" : n >= 1e3 ? Math.round(n/1e3) + "k" : String(n ?? 0);
const scoreCls = (v) => v >= 15 ? "s-hot" : v >= 8 ? "s-warm" : v > 0 ? "s-cold" : "s-zero";

setInterval(() => {
  const d = new Date();
  $("#clock").textContent = [d.getUTCHours(), d.getUTCMinutes(), d.getUTCSeconds()]
    .map(x => String(x).padStart(2, "0")).join(":");
}, 1000);

/* ---------------- licznik bazy + live ---------------- */
let STATS = null;
async function loadStats() {
  try {
    const s = await api("/api/stats");
    STATS = s;
    $("#dot").classList.add("ok");
    $("#live-label").textContent = "live";
    const n = s.podmioty, d = s.domeny;
    $("#db-count").innerHTML = n === 0
      ? `<b>świeża sesja</b> — baza pusta · szukaj, a scryer zbuduje graf z internetu`
      : `encje <b>${n}</b> · domeny <b>${d}</b> · bez DMARC <b style="color:${s.bez_dmarc ? "var(--bad)" : "var(--tx1)"}">${s.bez_dmarc}</b>`;
    $("#b-graph").textContent = n;
  } catch (e) {
    $("#dot").classList.remove("ok");
    $("#live-label").textContent = "offline";
  }
}

/* ---------------- graf ---------------- */
let GRAPH = null, ENGINE = null, graphBuilt = false;

function gdiag(msg, bad) {
  let d = document.getElementById("g-diag");
  if (!d) {
    $("#graph").insertAdjacentHTML("beforeend", '<div id="g-diag"></div>');
    d = document.getElementById("g-diag");
  }
  const t = new Date().toTimeString().slice(0, 8);
  d.insertAdjacentHTML("beforeend", `<div>· ${t} — ${esc(msg)}</div>`);
  d.style.color = bad ? "var(--bad)" : "var(--tx2)";
}

async function buildGraph() {
  try {
    gdiag("fetch /api/graph");
    GRAPH = await api("/api/graph");
    renderGraph();
  } catch (e) {
    gdiag("BŁĄD: " + e.message, true);
  }
}

function renderGraph() {
  const n = [], e = [];
  for (const p of GRAPH.podmioty) {
    const hot = p.score >= 15;
    n.push({
      id: "p" + p.id,
      label: p.nazwa.length > 34 ? p.nazwa.slice(0, 33) + "…" : p.nazwa,
      title: `${p.nazwa}\nsektor: ${p.sektor || "—"}\nmiasto: ${p.miasto || "—"}\nscore: ${p.score}\n(klik = profil)`,
      kind: "podmiot",
      color: colorOf(p.sektor),
      size: hot ? 16 : 12,
      hot,
    });
  }
  for (const d of GRAPH.domeny) {
    n.push({
      id: "d" + d.id, label: d.nazwa, kind: "domena",
      size: 6, color: d.mx ? "#55c8ff" : "#2c3c58",
      title: `${d.nazwa}\nMX: ${d.mx ? "tak" : "nie"}\nDMARC: ${d.dmarc || "BRAK"}`,
    });
    e.push({ s: "p" + d.podmiot_id, t: "d" + d.id, color: "#5a78b4", alpha: 0.10, len: 150 });
  }
  // osoby tylko gdy ich mało (nie siatka na graf)
  const emailed = new Set(GRAPH.emailed || []);
  if ((GRAPH.osoby || []).length <= 120) {
    for (const o of GRAPH.osoby) {
      const got = emailed.has(o.email);
      n.push({
        id: "o" + o.id, label: got ? "✉ " + o.email : o.email, kind: "osoba",
        size: 4.5, color: got ? "#35e0a1" : "#28374f", title: o.email,
      });
      e.push({ s: "p" + o.podmiot_id, t: "o" + o.id, color: "#5a78b4", alpha: 0.07, len: 120 });
    }
  }

  gdiag(`węzły: ${n.length}, krawędzie: ${e.length}`);
  $("#g-count").textContent = `${n.length} węzłów · ${e.length} krawędzi`;
  $("#b-graph").textContent = (GRAPH.podmioty || []).length;

  const container = $("#graph");
  if (!n.length) {
    let ov = document.getElementById("g-empty");
    if (!ov) {
      ov = document.createElement("div");
      ov.id = "g-empty";
      container.appendChild(ov);
    }
    ov.innerHTML = `<b>graf czeka na pierwszy trop</b><span>wróć do SZUKAJ i poszukaj czegokolwiek —<br>scryer zapyta internet i wklei tu to co znajdzie</span>`;
    $("#g-count").textContent = "0 węzłów";
    return;
  }
  document.getElementById("g-empty")?.remove();
  if (ENGINE && !ENGINE.alive) {
    ENGINE.destroy(); ENGINE = null;
    gdiag("silnik odtworzony (canvasy utracone)");
  }
  if (!ENGINE) {
    ENGINE = GraphEngine(container, {
      onDiag: (m, bad) => gdiag(m, bad),
      onCounts: (nv, ev) => { $("#g-count").textContent = `${nv} węzłów · ${ev} krawędzi`; },
      onSelect: (node) => {
        if (node && node.kind === "podmiot") showPodmiot(Number(String(node.id).slice(1)));
      },
    });
    if (!$("#legend").childElementCount) {
      $("#legend").innerHTML = Object.entries(SECTOR_COLORS)
        .filter(([k]) => !["discovery","other"].includes(k))
        .map(([k, c]) => `<span class="lg"><i style="background:${c}"></i>${k}</span>`).join("");
    }
  }
  ENGINE.setData({ nodes: n, edges: e });
  graphBuilt = true;
}

$("#g-fit").onclick = () => ENGINE?.fitView(true);
$("#refresh").onclick = async () => {
  await loadStats();
  if (currentTab === "graph") buildGraph();
};

/* ---------------- SZUKAJ ---------------- */
let netMode = "auto";
let lastResults = null;

async function runSzukaj(q) {
  const out = $("#s-out"), said = $("#s-said");
  out.innerHTML = netMode === "internet"
    ? '<div class="empty">pytam internet… (search → domeny → DNS → audyt WWW)</div>'
    : '<div class="empty">szukam…</div>';
  said.style.display = "none";
  try {
    const d = await api("/api/ai", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ q, mode: netMode === "auto" ? null : netMode }),
    });
    lastResults = d;
    said.style.display = "block";
    if (d.mode === "external") {
      said.innerHTML = `<span style="color:var(--cy)">◉ RECON</span> ${esc(d.said)} — zbieram DNS/RDAP/crt.sh/WWW…`;
      await deepRecon(d.q, true);
      return;
    }
    if (d.mode === "hybrid") {
      said.innerHTML = `<span style="color:var(--acc)">▸ ${esc(d.said)}</span>`;
      renderInternet(d.internet);
      renderLocal(d.local);
    } else if (d.mode === "internet") {
      said.innerHTML = `<span style="color:var(--cy)">◉ ${esc(d.said)}</span>`;
      renderInternet(d);
    } else {
      said.innerHTML = `<span style="color:var(--acc)">▸ ROZUMIEM</span> ${esc(d.said)} <span style="color:var(--tx3)">· ${d.count} wyników</span>`;
      renderLocal(d);
    }
    loadStats();
  } catch (e) {
    out.innerHTML = `<div class="empty" style="color:var(--bad)">✗ ${esc(e.message)}</div>`;
  }
}

function renderInternet(d) {
  const out = $("#s-out");
  const head = `<div class="sec-label">◉ internet · ${d.count || 0} domen · cache → ontologia</div>`;
  if (!d.items?.length) {
    out.insertAdjacentHTML("beforeend", head + '<div class="empty">internet nic sensownego nie zwrócił</div>');
    return;
  }
  out.insertAdjacentHTML("beforeend", head + d.items.map(h => {
    const mx = h.mx ? `<span class="pill p-ok">mx: ${esc(h.mx_provider || "tak")}</span>` : '<span class="pill p-bad">brak MX</span>';
    const dm = h.dmarc ? '<span class="pill p-ok">dmarc</span>' : '<span class="pill p-bad">bez DMARC</span>';
    const tls = h.https === false ? '<span class="pill p-bad">brak HTTPS</span>' : (h.hsts ? '<span class="pill p-ok">hsts</span>' : '');
    const csp = h.csp ? "" : '<span class="pill p-dim">bez CSP</span>';
    return `<div class="hit">
      <span class="t">${esc(h.title || h.domain)}</span>
      <span class="d">${esc(h.domain)}</span>
      ${mx}${dm}${tls}${csp}
      <span class="acts">
        <button class="gbtn" data-deep="${esc(h.domain)}">pogłęb ▸</button>
        <button class="gbtn" data-goto="${esc(h.domain)}">GRAF ◈</button>
      </span>
      <span class="u">${esc(h.url)}</span>
    </div>`;
  }).join(""));
}

function renderLocal(d) {
  const out = $("#s-out");
  if (!d.items?.length || d.kind !== "podmioty") {
    if (d.kind === "interakcje") {
      out.insertAdjacentHTML("beforeend", `<div class="sec-label">▸ lokal · interakcje</div>` +
        d.items.map(i => `<div class="lrow"><span class="score s-ok">${esc(i.typ)}</span><span style="color:var(--cy)">${esc(i.email)}</span><span style="color:var(--tx1)">${esc(i.temat)}</span></div>`).join(""));
    }
    return;
  }
  out.insertAdjacentHTML("beforeend", `<div class="sec-label">▸ lokalna baza · ${d.count}</div>` +
    d.items.map(p => `<div class="lrow row" data-id="${p.id}" style="cursor:pointer">
      <span class="score ${scoreCls(p.score)}">${p.score}</span>
      <span style="color:var(--tx0)">${esc(p.nazwa)}</span>
      <span><span class="sektor-dot" style="background:${colorOf(p.sektor)}"></span><span style="color:var(--tx2)">${esc(p.sektor || "—")}</span></span>
      <span style="margin-left:auto;color:var(--tx3)">${esc(p.miasto || "")}</span>
    </div>`).join(""));
}

/* pogłęb = pełny recon (DNS+RDAP+crt.sh+WWW+search) inline w wynikach */
async function deepRecon(q, replaceOut) {
  const out = $("#s-out"), said = $("#s-said");
  if (replaceOut) out.innerHTML = '<div class="empty">recon w toku…</div>';
  else out.insertAdjacentHTML("beforeend", '<div class="sec-label" id="deep-spin">◉ recon ' + esc(q) + ' w toku…</div>');
  try {
    const d = await api("/api/discover", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ q }),
    });
    document.getElementById("deep-spin")?.remove();
    renderRecon(d);
    loadStats();
  } catch (e) {
    said.innerHTML = `<span style="color:var(--bad)">✗ ${esc(e.message)}</span>`;
  }
}

function renderRecon(d) {
  const out = $("#s-out");
  const L = [`<div class="sec-label">◉ recon: ${esc(d.query)} ${d.domain_guessed ? `→ <span style="color:var(--cy)">${esc(d.domain_guessed)}</span>` : ""}</div>`];
  const kv = (k, v, cls) => v ? L.push(`<div class="lrow"><span class="k" style="color:var(--tx2);min-width:90px;text-transform:uppercase;font-size:9.5px;letter-spacing:1px">${k}</span><span style="color:${cls || "var(--tx1)"};overflow-wrap:anywhere">${v}</span></div>`) : null;
  const list = (arr, cls) => (arr || []).map(x => `<div class="lrow" style="padding-left:26px;color:${cls || "var(--tx1)"}">· ${esc(String(x))}</div>`).join("");
  if (d.dns) {
    L.push('<div class="sec-label">dns</div>');
    kv("A", (d.dns.a || []).join(", "));
    kv("MX", (d.dns.mx || []).join(" · "));
    kv("SPF", (d.dns.spf || [])[0]);
    kv("DMARC", (d.dns.dmarc || [])[0], d.dns.dmarc?.length ? "var(--acc)" : "var(--bad)");
    if (!d.dns.has_mail) L.push('<div class="lrow" style="color:var(--bad)">◉ brak MX — domena nie odbiera poczty</div>');
  }
  if (d.rdap?.registrar) {
    L.push('<div class="sec-label">rdap</div>');
    kv("registrar", esc(d.rdap.registrar));
    (d.rdap.dates || []).slice(0, 4).forEach(x => kv("", esc(x)));
  }
  if (d.subdomains?.length) {
    L.push(`<div class="sec-label">subdomeny (crt.sh) · ${d.subdomains.length}</div>`);
    L.push(list(d.subdomains.slice(0, 30), "var(--cy)"));
  }
  const w = d.www;
  if (w?.ok) {
    L.push('<div class="sec-label">www</div>');
    kv("title", esc(w.title || "—"));
    kv("generator", esc(w.generator || "—"));
    if (w.emails?.length) L.push(list(w.emails.slice(0, 12), "var(--cy)"));
    if (w.phones?.length) L.push(list(w.phones.slice(0, 6)));
    if (w.persons?.length) L.push(list(w.persons.slice(0, 12), "var(--acc)"));
  }
  if (d.web_results?.results?.length) {
    L.push(`<div class="sec-label">web · ${d.web_results.results.length}</div>`);
    for (const r of d.web_results.results.slice(0, 8)) {
      L.push(`<div class="lrow" style="flex-direction:column;gap:2px;align-items:flex-start"><a href="${esc(r.url)}" target="_blank" rel="noopener" style="color:var(--tx0)">${esc(r.title || r.url)}</a><span style="color:var(--tx3);font-size:10px">${esc(r.url)}</span></div>`);
    }
  }
  out.insertAdjacentHTML("beforeend", L.join(""));
}

/* ---------------- drawer (profil podmiotu) ---------------- */
async function showPodmiot(id) {
  try {
    const d = await api("/api/podmiot/" + id);
    const p = d.podmiot;
    $("#d-name").textContent = p.nazwa;
    $("#d-sub").innerHTML =
      `<span class="score ${scoreCls(p.tier_score)}">${p.tier_score}</span>` +
      `<span class="pill p-dim"><span class="sektor-dot" style="background:${colorOf(p.sektor)}"></span>${esc(p.sektor || "—")}</span>` +
      (p.miasto ? `<span class="pill p-dim">${esc(p.miasto)}</span>` : "");
    $("#d-body").innerHTML = `
      <section><h3>domeny / poczta</h3>${(d.domeny || []).map(x => `<div style="margin-bottom:7px">
          <div style="color:var(--tx0);margin-bottom:2px">${esc(x.nazwa)}</div>
          ${x.mx ? '<span class="pill p-ok">mx</span>' : '<span class="pill p-dim">no-mx</span>'}
          ${x.dmarc ? '<span class="pill p-ok">dmarc</span>' : '<span class="pill p-bad">bez DMARC</span>'}
        </div>`).join("") || '<span style="color:var(--tx3)">brak</span>'}
      </section>
      ${(d.osoby || []).length ? `<section><h3>osoby · ${d.osoby.length}</h3>${d.osoby.map(o => `<div style="margin-bottom:3px"><span class="em" data-copy="${esc(o.email)}" title="klik = kopiuj">${esc(o.email)}</span> ${o.rola ? `<span class="pill p-dim">${esc(o.rola)}</span>` : ""}</div>`).join("")}</section>` : ""}
      <section><h3>akcje</h3>
        <button class="btn" id="d-recon" style="width:100%" data-dom="${esc(d.domeny[0]?.nazwa || "")}">◉ pogłęb recon → ontologia</button>
      </section>`;
    $("#drawer").classList.add("on");
  } catch (e) { toast(e.message, "err"); }
}
$("#drawer-close").onclick = () => $("#drawer").classList.remove("on");
document.addEventListener("click", (ev) => {
  const c = ev.target.closest("[data-copy]");
  if (c) { navigator.clipboard?.writeText(c.dataset.copy); toast("skopiowano " + c.dataset.copy, "ok"); }
  const r = ev.target.closest("#d-recon");
  if (r) {
    if (!r.dataset.dom) return toast("brak domeny — użyj SZUKAJ", "err");
    switchTab("szukaj");
    deepRecon(r.dataset.dom, true);
  }
});

/* ---------------- skok do grafu ---------------- */
async function gotoGraph(dom) {
  try { GRAPH = await api("/api/graph"); } catch { return; }
  switchTab("graph");
  const hit = (GRAPH.domeny || []).find(x => x.nazwa === dom);
  if (hit) setTimeout(() => ENGINE?.follow("p" + hit.podmiot_id), 450);
}

/* ---------------- events ---------------- */
let currentTab = "szukaj";
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "view-" + tab));
  if (tab === "graph") buildGraph();
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => switchTab(b.dataset.tab));

$("#s-run").onclick = () => { const q = $("#s-in").value.trim(); if (q) { $("#s-out").innerHTML = ""; runSzukaj(q); } };
$("#s-in").addEventListener("keydown", (ev) => { if (ev.key === "Enter") $("#s-run").click(); });
$("#s-net").onclick = () => {
  netMode = netMode === "auto" ? "internet" : netMode === "internet" ? "local" : "auto";
  const lbl = { auto: "◉ net: auto", internet: "◉ net: WYMIUSZ", local: "◉ net: off" }[netMode];
  $("#s-net").textContent = lbl;
  $("#s-net").style.color = netMode === "internet" ? "var(--cy)" : "";
};
$("#s-out").addEventListener("click", (ev) => {
  const row = ev.target.closest(".lrow.row");
  if (row) { showPodmiot(Number(row.dataset.id)); return; }
  const deep = ev.target.closest("[data-deep]");
  if (deep) { document.getElementById("deep-spin")?.remove(); deepRecon(deep.dataset.deep, false); return; }
  const go = ev.target.closest("[data-goto]");
  if (go) gotoGraph(go.dataset.goto);
});

document.addEventListener("keydown", (ev) => {
  const typing = ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName);
  if (ev.key === "/" && !typing) { ev.preventDefault(); switchTab("szukaj"); $("#s-in").focus(); $("#s-in").select(); }
  if (ev.key.toLowerCase() === "g" && !typing) switchTab("graph");
  if (ev.key === "Escape") $("#drawer").classList.remove("on");
});

/* ---------------- boot ---------------- */
loadStats();
</script>
</body>
</html>
